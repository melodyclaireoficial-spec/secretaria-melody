name: Secretaria da Melody

# Os lembretes ao longo do dia são disparados pelo cron-job.org (agendador
# confiável, chama a Z-API direto). Aqui fica SÓ a resposta do check-in da noite,
# que precisa ler a mensagem da Melody (1/2/3) e ramificar — isso exige código.
# Horário em UTC: 21h local (Brasília, UTC-3) = 00:00 UTC do dia seguinte.
on:
  schedule:
    - cron: "0 0 * * 2-6"   # 21:00 local (seg a sex) -> resposta do check-in
  workflow_dispatch:
    inputs:
      acao:
        description: "Vazio = envio de teste. Ou: --fire HH:MM, ou: checkin"
        required: false
        default: ""

jobs:
  secretaria:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
      ZAPI_INSTANCE_ID: ${{ secrets.ZAPI_INSTANCE_ID }}
      ZAPI_TOKEN: ${{ secrets.ZAPI_TOKEN }}
      ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
      DISCIPLINA_WHATSAPP_NUMERO: ${{ secrets.DISCIPLINA_WHATSAPP_NUMERO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resposta do check-in (agendado)
        if: github.event_name == 'schedule'
        run: python responder_checkin.py

      - name: Disparo manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${{ github.event.inputs.acao }}" in
            "")        python enviar.py "Teste da secretaria (GitHub). Se chegou, esta tudo certo." ;;
            "checkin") python responder_checkin.py ;;
            *)         python rotina_diaria.py ${{ github.event.inputs.acao }} ;;
          esac
