name: Secretaria da Melody

# rotina_diaria.py agora lê a Agenda do Google ao vivo (em vez de uma grade
# fixa), então o disparo principal virou UM SÓ: o cron-job.org chama este
# workflow (via workflow_dispatch, disparo confiável) a cada 5 minutos, o
# ano inteiro, e rotina_diaria.py decide sozinho se algum compromisso está
# começando agora (ou se é 08:55/20:30, horários fixos de bomdia/checkin).
#
# A resposta ramificada do check-in da noite (lê 1/2/3 da Melody) continua
# tendo um agendamento nativo próprio como rede de segurança, porque depende
# de rodar DEPOIS da pergunta das 20:30 e não é um "compromisso" da agenda.
# Horário em UTC: 21h local (Brasília, UTC-3) = 00:00 UTC do dia seguinte.
on:
  schedule:
    - cron: "0 0 * * 2-6"   # 21:00 local (seg a sex) -> resposta do check-in
  workflow_dispatch:
    inputs:
      acao:
        description: "Vazio = checagem normal da agenda. Ou: checkin, --listar-hoje, --dry-run"
        required: false
        default: ""

jobs:
  secretaria:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
      ZAPI_INSTANCE_ID: ${{ secrets.ZAPI_INSTANCE_ID }}
      ZAPI_TOKEN: ${{ secrets.ZAPI_TOKEN }}
      ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
      DISCIPLINA_WHATSAPP_NUMERO: ${{ secrets.DISCIPLINA_WHATSAPP_NUMERO }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resposta do check-in (agendado, rede de segurança)
        if: github.event_name == 'schedule'
        run: python responder_checkin.py

      - name: Checagem da agenda / disparo manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${{ github.event.inputs.acao }}" in
            "")        python rotina_diaria.py ;;
            "checkin") python responder_checkin.py ;;
            *)         python rotina_diaria.py ${{ github.event.inputs.acao }} ;;
          esac
